name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (GCC 13)
            compiler: g++-13
            cc: gcc-13
            cxx: g++-13
            packages: ninja-build g++-13

          - os: ubuntu-latest
            name: Linux (Clang 17)
            compiler: clang++-17
            cc: clang-17
            cxx: clang++-17
            packages: ninja-build clang-17

          - os: windows-latest
            name: Windows (MSVC)
            compiler: msvc
            cc: cl
            cxx: cl
            packages: ""

          - os: macos-latest
            name: macOS (AppleClang)
            compiler: appleclang
            cc: cc
            cxx: c++
            packages: ninja

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    # macOS AppleClang lacks std::views::zip and std::from_chars for doubles
    continue-on-error: ${{ matrix.os == 'macos-latest' }}

    steps:
      - uses: actions/checkout@v4

      # -- Install CMake 4.0+ (required by the project) --
      - name: Install CMake 4.0+ via pip
        run: pip install "cmake>=4.0"

      # -- Install platform dependencies --
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ${{ matrix.packages }}

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      # -- Set up MSVC environment on Windows --
      - name: Set up MSVC Developer Environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # -- Configure --
      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      # -- Build --
      - name: Build
        run: cmake --build build

      # -- Test --
      - name: Test
        run: ctest --test-dir build --output-on-failure
